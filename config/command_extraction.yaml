# Command-extraction configuration.

h_sel:
  mode: bilateral_vz
  sigma_s: 4
  sigma_r: 250
  n_passes: 2
  tol_ftmin: 250
  min_len: 10

phases:
  climb_fpm: 200.0
  descent_fpm: -200.0
  ground_ft: 100.0
  ground_cas_kt: 50.0
  ground_max_abs_vz_fpm: 200.0
  smooth_s: 15

leading_ground:
  initial_window_s: 60
  initial_max_gs_kt: 50.0
  initial_max_abs_vz_fpm: 200.0
  airborne_altitude_gain_ft: 200.0
  airborne_min_gs_kt: 80.0
  airborne_min_vz_fpm: 200.0
  airborne_window_s: 30

# FL100 is the boundary between the inferred low- and high-CAS schedule bands.
speed_law:
  fl100_ft: 10000.0
