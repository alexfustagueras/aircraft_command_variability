# Flight-surveillance QC.  This stage reads only stored ADS-B observations.
# It precedes ERA5 enrichment and command extraction.

adsb_filter: traffic_default_v1
qc_implementation: cleaned_messages_altitude_outliers_recorded_v3

message_cleaning:
  # OpenSky stamps each stored ADS-B message with the time it reached the
  # network. A message re-received later (receiver buffering, ingestion
  # incidents) reappears with a later timestamp. A moving aircraft never
  # broadcasts the same airborne-position message twice, so only the earliest
  # reception of each distinct message is kept.
  keep_earliest_reception: true
  # Stale positions without an earlier copy: a row is dropped when its
  # altitude departs from the median of per-second medians within a centred
  # window (one vote per second, so a burst of rows cannot outvote the track).
  altitude_outlier_passes:
    - {half_window_s: 30, threshold_ft: 1000}
    - {half_window_s: 120, threshold_ft: 3000}

altitude_teleport:
  airborne_alt_ft: 3000
  jump_ft: 3000
  # A one-sample A→B→A spike is repairable only with immediate coverage on
  # both sides and a plausible A→A through-rate.
  max_repair_neighbor_gap_s: 2
  max_through_rate_fpm: 6000
  reject_unrepaired_jumps: 10

trajectory_integrity:
  # A single route trajectory cannot return below 1,000 ft between two FL200+
  # portions.  Normal departure and final arrival are outside this pattern.
  midflight_low_altitude_ft: 1000
  resumed_cruise_altitude_ft: 20000
