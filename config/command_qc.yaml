# Automatic flight exclusion during command extraction

h_sel:
  # No credible selected altitude while aircraft was high.
  min_present_ft: 3000
  min_alt_for_missing_ft: 15000
  # h_sel clearly unusable at cruise-like FL.
  broken_h_sel_max_ft: 8000
  min_fl_alt_ft: 25000
  # MCP far below flown FL.
  h_sel_alt_ratio_min: 0.70
  weird_mcp_max_h_sel_ft: 22000

vertical_rate:
  climb_fpm: 200
  min_fl_alt_ft: 15000
  # Require at least 60 s labelled CLIMB when aircraft reached FL150+.
  min_climb_phase_s: 60
  # Among airborne samples, fraction with |Vz| > climb_fpm must exceed this.
  min_airborne_vz_fraction: 0.03
  airborne_alt_ft: 3000

altitude_noise:
  # Raw surveillance jumps are assessed by flight QC before extraction.
  airborne_alt_ft: 3000
  unrepaired_jump_ft: 3000
  max_repair_neighbor_gap_s: 2

speed_schedule:
  airborne_alt_ft: 3000
  # The explicit selected-speed law must cover the whole airborne replay
  # interval. This is a representation invariant, not a tuned threshold.
  min_airborne_coverage_fraction: 1.0
  # Direct BDS support is separate from selected-speed coverage.
  min_bds_support_coverage_fraction: 0.20
  # Report the longest outage without imposing a global rejection.
  max_bds_support_gap_s: null

timeline:
  # European short-/medium-haul command grids; reject long-haul bleed-through.
  max_duration_h: 8.0
  # Secondary ``time`` column (seconds).
  max_time_column_s: 28800
  # ``time`` must not exceed timestamp span by more than this ratio.
  time_timestamp_ratio_max: 1.25

# Post-resample bounded interpolation for selected speed channels only.
preprocessing:
  mach_ias_max_gap_s: 100