mach:
  mode: savgol_mach
  # A Mach command begins only at a sustained plateau, not when the raw Mach
  # trace first crosses an arbitrary altitude floor.
  tol: 0.006
  min_len: 60
  alt_threshold: 20000
  use_alt: true
  smooth_window: 120
  smooth_method: binned

cas:
  mode: savgol_cas
  tol: 10.0
  min_len: 60
  use_alt: false
  smooth_window: 150
  smooth_method: binned

vz:
  mode: savgol_vz
  tol: 25
  min_len: 15
  use_alt: false
  min_abs_value: -1
  smooth_window: 10
  smooth_method: binned

h_sel:
  mode: bilateral_vz
  sigma_s: 4
  sigma_r: 250
  n_passes: 2
  tol_ftmin: 250
  min_len: 10

phases:
  climb_fpm: 200.0
  descent_fpm: -200.0
  ground_ft: 100.0
  smooth_s: 15
